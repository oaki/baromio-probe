name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM per archive
        run: |
          for f in dist/*.tar.gz; do
            syft "$f" -o cyclonedx-json="$f.sbom.json"
          done

      - name: Sign binaries and checksums keylessly
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Sign the container image
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/oaki/baromio-probe:${GITHUB_REF_NAME#v} --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "ghcr.io/oaki/baromio-probe@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*.tar.gz"

      - name: Upload SBOMs and signatures to the release
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/*.sbom.json dist/checksums.txt.sig dist/checksums.txt.pem --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

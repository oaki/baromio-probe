name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | (! grep .)
      - run: go test -race ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # staticcheck@latest cannot yet read the export data of the Go 1.27.2 compiler
      # ("export data version 5 is greater than maximum supported version 4"). The same code
      # passes it on Go 1.27.1, so this is the tool lagging, not the code. Make it blocking
      # again once a staticcheck release supports 1.27.2.
      - name: staticcheck
        continue-on-error: true
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
